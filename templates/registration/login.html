<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — ELZHAS SCHOOL</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-emerald-950 to-emerald-700 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-11 h-11 rounded-xl bg-emerald-600 text-white font-black text-xl flex items-center justify-center">E</div>
      <div>
        <div class="font-extrabold text-lg">ELZHAS SCHOOL</div>
        <div class="text-xs text-slate-500">Электронный журнал</div>
      </div>
    </div>

    <h1 class="text-2xl font-bold mb-1">Добро пожаловать 👋</h1>
    <p class="text-sm text-slate-500 mb-6">Войдите под своим логином и паролем</p>

    {% if form.errors %}
      <div class="bg-red-50 text-red-700 text-sm p-3 rounded-xl mb-4">
        Неверный логин или пароль. Попробуйте снова.
      </div>
    {% endif %}

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">Логин</label>
        <input type="text" name="username" required autofocus class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-emerald-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">Пароль</label>
        <input type="password" name="password" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-emerald-500">
      </div>
      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl transition">
        Войти
      </button>
    </form>
  </div>
</body>
</html>
